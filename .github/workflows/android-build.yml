name: Android and backend checks

on:
  push:
    branches: [main, feature/auth-backend-player-foundation, work/balidan-provider-architecture, work/balidan-postgres-validation]
  pull_request:
    branches: [main, feature/auth-backend-player-foundation]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: balidan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d balidan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/balidan_test
      JWT_SECRET: ci-test-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: PostgreSQL migrations and API integration tests
        run: npm run test:postgres

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate wrapper because this repository does not currently contain one
        run: gradle wrapper --gradle-version 8.9
      - name: Compile Android debug variant (no APK artifact)
        run: ./gradlew :app:compileDebugKotlin -PAPI_BASE_URL="https://myandroidapp-api.onrender.com"
