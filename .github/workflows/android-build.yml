name: Android and backend checks

on:
  push:
    branches: [main, feature/auth-backend-player-foundation, work/balidan-provider-architecture]
  pull_request:
    branches: [main, feature/auth-backend-player-foundation]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run check
      - run: npm test

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android debug variant (no APK artifact)
        run: ./gradlew :app:compileDebugKotlin -PAPI_BASE_URL="https://myandroidapp-api.onrender.com"
