name: Android classroom APK and backend checks

on:
  push:
    branches: [main, feature/auth-backend-player-foundation, work/balidan-provider-architecture, work/balidan-postgres-validation, work/catalogue-phase1, work/recorded-playback-phase2, work/balidan-independent-staging]
  pull_request:
    branches: [main, feature/auth-backend-player-foundation]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: balidan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d balidan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/balidan_test
      JWT_SECRET: ci-test-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: PostgreSQL migrations and API integration tests
        run: npm run test:postgres
      - name: Verify deployed DEMO_MODE endpoints (isolated legacy staging only)
        if: github.ref != 'refs/heads/work/balidan-independent-staging'
        env:
          DEMO_API_BASE_URL: https://balidan-rwa-demo-staging.onrender.com
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const base = process.env.DEMO_API_BASE_URL;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let health;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              health = await fetch(base + "/health");
              if (health.ok) break;
            } catch {}
            await sleep(5000);
          }
          assert.ok(health?.ok, "staging health endpoint did not become ready");
          const call = async (path, options = {}, expected = 200) => {
            const response = await fetch(base + path, options);
            assert.equal(response.status, expected, path + " returned " + response.status);
            return response.status === 204 ? null : response.json();
          };
          const catalogue = await call("/v1/demo/catalogue");
          assert.equal(catalogue.mode, "demo");
          assert.equal(catalogue.batches.length, 2);
          assert.equal(catalogue.courses.length, 2);
          assert.equal(catalogue.chapters.length, 2);
          assert.equal(catalogue.lectures.length, 2);
          assert.equal(catalogue.liveClasses.length, 2);
          for (const [id, decision] of [
            ["demo-free-lecture", "granted"],
            ["demo-premium-lecture", "granted"],
            ["demo-denied-lecture", "denied"],
            ["demo-expired-lecture", "expired"],
            ["demo-unknown-lecture", "unknown"]
          ]) {
            const result = await call("/v1/demo/entitlements/content/" + id);
            assert.equal(result.decision, decision);
            assert.equal(result.source, "demo_only");
          }
          for (const id of ["demo-free-lecture", "demo-premium-lecture"]) {
            const session = await call("/v1/demo/playback/sessions", {
              method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ contentId: id })
            }, 201);
            assert.equal(session.status, "demo_preview");
            assert.equal(session.providerAuthorization, false);
            assert.ok(["demo-free", "demo-premium"].includes(session.mediaRef));
            assert.equal(session.playbackUrl, undefined);
          }
          for (const id of ["demo-denied-lecture", "demo-expired-lecture", "demo-unknown-lecture"]) {
            await call("/v1/demo/playback/sessions", {
              method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ contentId: id })
            }, 403);
          }
          for (const id of ["demo-free-live-class", "demo-premium-live-class"]) {
            const room = await call("/v1/demo/live/sessions", {
              method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ liveClassId: id })
            }, 201);
            assert.equal(room.status, "joined");
            assert.equal(room.roomType, "local_demo");
            assert.equal(room.providerAuthorization, false);
            assert.equal(room.joinUrl, undefined);
            const left = await call("/v1/demo/live/sessions/" + id + "/leave", { method: "POST" });
            assert.equal(left.status, "left");
            assert.equal(left.sessionClosed, true);
          }
          for (const id of ["demo-denied-live-class", "demo-expired-live-class", "demo-unknown-live-class"]) {
            await call("/v1/demo/live/sessions", {
              method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ liveClassId: id })
            }, 403);
          }
          console.log("All deployed DEMO_MODE catalogue, entitlement, playback and live endpoints passed.");
          NODE

  android-classroom-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate wrapper because this repository does not currently contain one
        run: gradle wrapper --gradle-version 8.9
      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build standard Debug APK
        run: |
          ./gradlew :app:assembleDebug
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/balidan-rwa-standard-debug.apk
      - name: Build Demo Debug APK (isolated demo catalogue and sample playback)
        run: |
          ./gradlew :app:assembleDebug -PDEMO_MODE=true -PAPI_BASE_URL="https://balidan-rwa-demo-staging.onrender.com"
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/balidan-rwa-demo-debug.apk
      - name: Report APK file sizes and checksums
        run: |
          ls -lh apk-output/*.apk
          sha256sum apk-output/*.apk
      - name: Upload standard and Demo Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: balidan-rwa-debug-apks
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
