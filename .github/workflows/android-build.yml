name: Android build

on:
  push:
    branches: [main, feature/auth-backend-player-foundation]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check backend JavaScript syntax
        run: node --check backend/src/server.js

  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle assembleDebug -PAPI_BASE_URL=https://api.example.invalid/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAndroidApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
